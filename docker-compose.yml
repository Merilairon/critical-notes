# Critical Notes with the 5etools clones mounted read-only (clone them first: `pnpm data:clone`, or the
# two `git clone --depth 1` commands in the README). App data lives in the `app-data` volume.
#   docker compose up -d                              start (http://localhost:3000), pulling the published image
#   docker compose pull && docker compose up -d       update to the newest release (migrations run on start)
#   CN_VERSION=1.2.0 docker compose up -d             pin a version (or put CN_VERSION=1.2.0 in .env)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build   build from this checkout instead
#   docker compose --profile tools run --rm data-update   pull the latest 5etools data, then:
#   docker compose restart app                        re-index on start (only changed files are read)
services:
  app:
    # The published image (built by .github/workflows/release.yml). Builds from the checkout: docker-compose.build.yml
    image: ghcr.io/merilairon/critical-notes:${CN_VERSION:-latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # The address people open the app at (an https:// address makes session cookies Secure)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Backups (README "Backups"). Scheduled backups are ON by default here: one every 24 hours, keeping the newest 7.
      # Set BACKUP_EVERY_HOURS=0 in .env to turn them off. An empty value behaves as unset (the default).
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      # Where backup zips go inside the container (default /data/app/backups). The folder must be writable by uid 1000.
      BACKUP_DIR: ${BACKUP_DIR:-}
    volumes:
      - ./5etools-data/5etools-src:/data/5etools-src:ro
      - ./5etools-data/5etools-img:/data/5etools-img:ro
      - app-data:/data/app
    restart: unless-stopped
    # A tiny init process as PID 1: it forwards SIGTERM/SIGINT (`docker stop`, Ctrl+C) and reaps children
    init: true
    # The server waits up to 8 s for a running backup (+ up to 2 s for requests) on `docker stop`; Docker's default of 10 s is too tight
    stop_grace_period: 15s

  data-update:
    profiles: [tools]
    image: buildpack-deps:bookworm-scm
    # Runs as you, so the clones stay yours (set UID/GID if yours are not 1000)
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /work
    environment:
      HOME: /tmp
      SKIP_INDEX: "1"
    volumes:
      - ./scripts:/work/scripts:ro
      - ./5etools-data:/work/5etools-data
    command: ["bash", "scripts/data-update.sh"]

volumes:
  app-data:
