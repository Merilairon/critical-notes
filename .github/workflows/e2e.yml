# Browser tests (pnpm e2e) on a SELF-HOSTED runner that has a local 5etools clone (Task M5.3, decision D4).
#
# INACTIVE until the owner registers a runner with the labels below: with no matching runner the job just
# queues. Setup and the security rules: docs/STATUS.md ("Browser tests in CI") and CONTRIBUTING.md.
#
# Data safety:
#  - Only pull requests from THIS repository run (never forks, never pull_request_target). A fork PR is skipped.
#  - The 5etools clone is read in place from the runner (FIVETOOLS_SRC_PATH); it is never copied into the
#    checkout, committed or uploaded.
#  - Nothing is uploaded: no upload-artifact, no cache. Traces, screenshots, the HTML report and error
#    context contain rules text, so tracing and the HTML report are off here (E2E_NO_ARTIFACTS), the test
#    reporter prints only titles, statuses and durations (no error text), the server log is dropped, and the
#    report folders and temp data folders are deleted at the end of every run, also when it fails.
#  - A same-repository PR runs ITS OWN copy of this file, the config and the specs on the runner: see the
#    trust warning in docs/STATUS.md.
name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser tests (self-hosted)
    # workflow_dispatch can only be started by someone with write access, on a branch of this repository
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, 5etools]
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_NO_ARTIFACTS: '1'
      # FIVETOOLS_SRC_PATH (absolute path of the runner's 5etools-src clone) and optionally CHROME_PATH
      # and FIVETOOLS_IMG_PATH come from the runner's own environment (its .env file), not from this repo.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the runner's 5etools clone
        run: |
          if [ -z "${FIVETOOLS_SRC_PATH:-}" ] || [ "${FIVETOOLS_SRC_PATH#/}" = "$FIVETOOLS_SRC_PATH" ]; then
            echo "::error::FIVETOOLS_SRC_PATH must be set in the runner's environment to an absolute path (see docs/STATUS.md)"
            exit 1
          fi
          if [ ! -d "$FIVETOOLS_SRC_PATH/data" ]; then
            echo "::error::No 5etools data under FIVETOOLS_SRC_PATH on this runner"
            exit 1
          fi

      # Reads the version from "packageManager" in package.json (pnpm 11.0.9)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - run: pnpm install --frozen-lockfile

      - name: Browser tests
        run: pnpm e2e

      # A self-hosted workspace outlives the run: remove everything that can hold rules text
      - name: Remove reports and test output
        if: always()
        run: rm -rf playwright-report test-results e2e/.auth blob-report "${TMPDIR:-/tmp}"/cn-e2e-*
