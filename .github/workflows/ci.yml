# The gate from CONTRIBUTING.md on every push to main and every pull request.
# It needs no 5etools clone: unit and API tests use the invented fixture.
# Browser tests (pnpm e2e) are a separate job (Task M5.3), not part of this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Reads the version from "packageManager" in package.json (pnpm 11.0.9)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -s typecheck

      - name: Lint
        run: pnpm -s lint

      - name: Test
        run: pnpm -s test

      - name: Build
        run: pnpm build
